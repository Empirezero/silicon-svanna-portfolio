<div class="hero-section d-flex flex-column align-items-center justify-content-center text-center overflow-hidden">
  <div @backgroundCircles class="bg-circles">
    <div class="circle circle-ping c1"></div>
    <div class="circle circle-ping c2"></div>
    <div class="circle circle-ping c3"></div>
    <div class="circle circle-pulse c4"></div>
    <div class="circle c5"></div>
  </div>
  <img
    @scaleIn
    class="profile-img rounded-circle"
    src="assets/profile.jpg"
    alt="Dancan Ngugi"
    onerror="this.src='https://ui-avatars.com/api/?name=Dancan+Ngugi&size=128&background=333&color=fff'"
  />
  <div @slideInUp class="hero-text z-2 mt-3">
    <h2 class="role-text text-uppercase text-secondary tracking-wide mb-2">
      Full-Stack Developer
    </h2>
    <h1 class="display-6 fw-semibold px-3">
      <span>{{ displayText }}</span>
      <span class="cursor">|</span>
    </h1>
    <div class="mt-4 d-flex flex-wrap justify-content-center gap-2">
      <a routerLink="/about" class="hero-btn">About</a>
      <a routerLink="/projects" class="hero-btn">Projects</a>
      <a routerLink="/skills" class="hero-btn">Skills</a>
      <a routerLink="/contact" class="hero-btn">Contact</a>
    </div>
  </div>
</div>
