<div class="contact-section d-flex flex-column align-items-center justify-content-center h-100 px-4 position-relative">

  <h3 class="section-title text-uppercase text-secondary mb-4">Contact</h3>

  <h4 class="fw-semibold mb-1">I have just what you need.</h4>
  <span class="text-decoration-underline text-secondary mb-4">Let Us Talk</span>

  <!-- Contact Info -->
  <div class="d-flex flex-column gap-3 mb-4">
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-telephone-fill contact-icon"></i>
      <p class="mb-0">+254717136695</p>
    </div>
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-envelope-fill contact-icon"></i>
      <p class="mb-0">dancanngugi79&#64;gmail.com</p>
    </div>
    <div class="d-flex align-items-center gap-3">
      <i class="bi bi-geo-alt-fill contact-icon"></i>
      <p class="mb-0">Rainbow Resort Lane, Nairobi</p>
    </div>
  </div>

  <!-- Contact Form -->
  <form (ngSubmit)="sendEmail()" class="contact-form d-flex flex-column gap-3">
    <div class="d-flex gap-3">
      <input
        [(ngModel)]="form.name"
        name="name"
        type="text"
        placeholder="Name"
        class="contact-input"
        required
      />
      <input
        [(ngModel)]="form.email"
        name="email"
        type="email"
        placeholder="Email"
        class="contact-input"
        required
      />
    </div>
    <input
      [(ngModel)]="form.subject"
      name="subject"
      type="text"
      placeholder="Subject"
      class="contact-input"
    />
    <textarea
      [(ngModel)]="form.message"
      name="message"
      placeholder="Message"
      class="contact-input"
      rows="4"
      required
    ></textarea>
    <button type="submit" [disabled]="loading" class="submit-btn">
      {{ loading ? 'Sending...' : 'Send Message' }}
    </button>
  </form>

</div>
